<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="BloonsTDC is a build-free tower defense game with ten maps and local progression." />
  <title>BloonsTDC</title>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script type="application/javascript" src="js/audio.js"></script>
  <script type="application/javascript" src="js/storage.js"></script>
  <script type="application/javascript" src="js/data_bloons.js"></script>
  <script type="application/javascript" src="js/data_towers.js"></script>
  <script type="application/javascript" src="js/data_heroes.js"></script>
  <script type="application/javascript" src="js/data_maps.js"></script>
  <script type="application/javascript" src="js/data_meta.js"></script>
  <script type="application/javascript" src="js/renderer.js"></script>
  <script type="application/javascript" src="js/engine.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand plain" data-go="home"><span class="brand-icon" aria-hidden="true">✹</span> Bloons<span>TDC</span></button>
    <div class="profile">
      <span class="pill money" title="Monkey Money"><span aria-hidden="true">◈</span> <b id="monkey-money">250</b> MM</span>
      <span class="pill xp" title="Account level and experience"><b id="account-level">LVL 1</b><progress id="account-xp" value="0" max="100" aria-label="Account experience"></progress></span>
      <button type="button" id="sound" class="icon-button" title="Toggle effects" aria-label="Toggle effects">♪</button>
      <button type="button" id="music" class="icon-button" title="Toggle music" aria-label="Toggle music">♫</button>
      <button type="button" id="backup" class="quiet">Backup</button>
    </div>
  </header>
  <main id="shell">
    <section id="home" class="screen">
      <div class="hero-banner">
        <canvas id="home-art" width="1200" height="800" aria-hidden="true"></canvas>
        <div class="banner-content">
          <span class="banner-rule" aria-hidden="true">✦ <span></span></span>
          <h1>Bloons<span>TDC</span></h1>
          <p>Build your defense. Hold the line.</p>
          <button type="button" class="green play" data-go="maps">▶&#xFE0E; Play</button>
        </div>
      </div>
      <nav class="home-nav" aria-label="Game menu">
        <button type="button" data-go="heroes"><b aria-hidden="true">★</b><span>Heroes<small>Choose your commander</small></span></button>
        <button type="button" data-go="cases"><b aria-hidden="true">▣</b><span>Case Shop<small>Unlock tower Instas</small></span></button>
        <button type="button" data-go="shop"><b aria-hidden="true">ϟ</b><span>Powers<small>Gear and account upgrades</small></span></button>
        <button type="button" data-go="tasks"><b aria-hidden="true">✓</b><span>Tasks<small>Claim your rewards</small></span></button>
        <button type="button" data-go="instas"><b aria-hidden="true">✦</b><span>Insta Collection<small>Deploy pre-upgraded towers</small></span></button>
      </nav>
    </section>
    <section id="maps" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Choose a map</h1></div>
      <div id="map-filters" class="filters" aria-label="Map difficulty"><button type="button" data-map-filter="all">All maps</button><button type="button" data-map-filter="easy">Easy</button><button type="button" data-map-filter="medium">Medium</button><button type="button" data-map-filter="hard">Hard</button><button type="button" data-map-filter="expert">Expert</button></div>
      <div id="map-list" class="cards map-grid"></div>
    </section>
    <section id="heroes" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Heroes</h1></div>
      <div id="hero-list" class="cards"></div>
    </section>
    <section id="cases" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Case Shop</h1></div>
      <div id="case-list" class="cards"></div>
    </section>
    <section id="shop" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Powers &amp; Upgrades</h1></div>
      <h2>Powers</h2><div id="power-list" class="cards"></div>
      <h2>Account upgrades</h2><div id="account-shop" class="cards"></div>
    </section>
    <section id="tasks" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Tasks</h1></div>
      <div class="filters"><label>Category <select id="task-category" aria-label="Task category"></select></label><label>Search <input type="search" id="task-search" placeholder="Search tasks" /></label><label class="check"><input type="checkbox" id="task-ready" /> Claimable only</label></div>
      <div id="task-count" class="subtle"></div><div id="task-list" class="task-list"></div>
    </section>
    <section id="instas" class="screen" hidden="hidden">
      <div class="section-head"><button type="button" class="quiet" data-go="home">← Menu</button><h1>Insta Collection</h1></div>
      <div id="insta-list" class="cards dense"></div>
    </section>
    <section id="match" class="screen" hidden="hidden">
      <div class="match-top">
        <button type="button" id="pause" class="quiet">Pause</button>
        <div class="match-name"><b id="match-map"></b><small id="match-mode"></small></div>
        <div class="match-metrics"><span title="Lives">♥ <b id="lives">150</b></span><span title="Cash">＄ <b id="cash">650</b></span><span id="round">Round 1 / 60</span></div>
      </div>
      <div class="board-layout">
        <div class="game-view">
          <canvas id="board" width="1200" height="800" tabindex="0" aria-label="Tower defense map. Select a tower, then choose a point off the path."></canvas>
          <div id="hint" aria-live="polite"></div>
          <div id="sandbox-drawer" hidden="hidden">
            <label for="enemy-type">Enemy</label><select id="enemy-type"></select>
            <label><input type="checkbox" id="enemy-camo" /> Camo</label><label><input type="checkbox" id="enemy-regrow" /> Regrow</label><label><input type="checkbox" id="enemy-fort" /> Fortified</label>
            <button type="button" data-sandbox="spawn">Spawn ×1</button><button type="button" data-sandbox="ten">Spawn ×10</button>
            <label>Round <input type="number" min="1" max="9999" id="sandbox-round" value="1" /></label><button type="button" data-sandbox="set">Set</button><button type="button" data-sandbox="reset">Clear enemies</button>
          </div>
          <div class="board-controls">
            <div id="abilities" aria-label="Active abilities"></div>
            <div class="wave-controls"><button type="button" id="sandbox-toggle" class="quiet" hidden="hidden">Sandbox</button><label class="check"><input type="checkbox" id="auto" /> Auto</label><button type="button" id="speed" class="quiet">1×</button><button type="button" id="start" class="green">▶&#xFE0E; Start wave</button></div>
          </div>
        </div>
        <aside class="match-shop">
          <div class="tabs" id="match-tabs"><button type="button" data-tab="towers">Towers</button><button type="button" data-tab="powers">Powers</button><button type="button" data-tab="instas">Instas</button></div>
          <div id="match-catalog"></div>
          <div id="inspector" hidden="hidden"></div>
        </aside>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden="hidden"></div>
  <dialog id="modal" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button type="button" id="modal-close" class="icon-button" title="Close" aria-label="Close">×</button></header>
    <div id="modal-body"></div>
  </dialog>
</body>
</html>
